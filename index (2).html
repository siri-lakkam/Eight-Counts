<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eight Counts: your sky sets the tempo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120d0b;
      --panel: #1c1613;
      --ink: #f6efe7;
      --muted: #b3a498;
      --accent: #ff5a3c;
      --gold: #ffc857;
      --line: rgba(255, 255, 255, 0.12);
      --beat: 0.5s;
      --display: "Bebas Neue", Impact, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      background:
        radial-gradient(60rem 30rem at 50% -10%, rgba(255, 90, 60, 0.28), transparent 70%),
        var(--bg);
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      line-height: 1.5;
    }
    .wrap { max-width: 62rem; margin: 0 auto; display: grid; gap: 1.25rem; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 7rem);
      line-height: 0.9;
      letter-spacing: 0.03em;
    }
    h1 span { color: var(--accent); }
    .tag { margin-top: 0.6rem; color: var(--muted); font-size: 1.1rem; max-width: 36rem; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 1.25rem;
    }
    h2 {
      font-family: var(--display);
      font-weight: 400;
      font-size: 1.7rem;
      letter-spacing: 0.06em;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
    .grow { flex: 1 1 14rem; }

    button, input { font: inherit; }
    .btn {
      background: var(--accent);
      color: #1a0d09;
      border: 0;
      border-radius: 2rem;
      padding: 0.7rem 1.4rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn:focus-visible, input:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }
    input[type="text"] {
      flex: 1 1 12rem;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 2rem;
      padding: 0.7rem 1rem;
    }
    .msg { margin-top: 0.75rem; color: var(--muted); min-height: 1.5rem; }
    .msg.error { color: #ff8a73; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat { background: var(--bg); border-radius: 0.75rem; padding: 0.7rem 0.9rem; }
    .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1.1; }
    .stat small { color: var(--muted); }
    .mood { color: var(--muted); margin-bottom: 1rem; }

    .stage {
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 4.5rem),
        linear-gradient(180deg, #241a14, #1a120e);
    }
    .note { color: var(--muted); margin-bottom: 1rem; }
    .pads { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0.6rem; list-style: none; padding: 0; margin-bottom: 1.25rem; }
    .pad {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      padding: 0.7rem 0.4rem;
      min-height: 7.5rem;
      text-align: center;
      transition: transform 0.08s, background 0.08s;
    }
    .pad .n { display: block; font-family: var(--display); font-size: 2.2rem; color: var(--gold); line-height: 1.1; }
    .pad .m { font-size: 0.85rem; }
    .pad.on {
      background: var(--accent);
      color: #1a0d09;
      transform: translateY(-6px);
      box-shadow: 0 0.6rem 1.6rem rgba(255, 90, 60, 0.45);
    }
    .pad.on .n { color: #1a0d09; }

    .controls label { color: var(--muted); display: inline-flex; gap: 0.5rem; align-items: center; }
    .pulse { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); }
    .playing .pulse { animation: beat var(--beat) ease-out infinite; }
    @keyframes beat {
      from { box-shadow: 0 0 0 0 rgba(255, 90, 60, 0.7); }
      to { box-shadow: 0 0 0 1.2rem rgba(255, 90, 60, 0); }
    }
    footer { color: var(--muted); font-size: 0.85rem; text-align: center; }

    @media (max-width: 720px) {
      .pads { grid-template-columns: repeat(4, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .playing .pulse { animation: none; }
      .pad { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Eight <span>Counts</span></h1>
      <p class="tag">Your sky sets the tempo. Get a weather-matched combo, a beat to move to, and a voice counting you in.</p>
    </header>

    <section class="card" aria-labelledby="step1">
      <h2 id="step1">1 · Where are you dancing?</h2>
      <div class="row">
        <button class="btn" id="geoBtn" type="button">Use my location</button>
        <form class="row grow" id="cityForm">
          <label class="sr-only" for="city">City</label>
          <input id="city" type="text" placeholder="…or type a city" autocomplete="off">
          <button class="btn ghost" type="submit">Find</button>
        </form>
      </div>
      <p class="msg" id="locMsg" role="status" aria-live="polite"></p>
    </section>

    <section class="card" id="weatherCard" aria-labelledby="step2" hidden>
      <h2 id="step2">2 · Today’s tempo</h2>
      <div class="stats">
        <div class="stat"><b id="wSky">–</b><small>Sky</small></div>
        <div class="stat"><b id="wTemp">–</b><small>Temperature</small></div>
        <div class="stat"><b id="wHum">–</b><small>Humidity</small></div>
        <div class="stat"><b id="wWind">–</b><small>Wind</small></div>
        <div class="stat"><b id="wBpm">–</b><small>BPM</small></div>
      </div>
      <p class="mood" id="moodLine"></p>
      <button class="btn" id="comboBtn" type="button">Choreograph my combo</button>
      <p class="msg" id="comboMsg" role="status" aria-live="polite"></p>
    </section>

    <section class="card stage" id="stageCard" aria-labelledby="comboName" hidden>
      <h2 id="comboName">Your combo</h2>
      <p class="note" id="comboNote"></p>
      <ol class="pads" id="pads"></ol>
      <div class="row controls" id="controls">
        <button class="btn" id="playBtn" type="button">Play</button>
        <span class="pulse" aria-hidden="true"></span>
        <label><input type="checkbox" id="voice" checked> Count out loud</label>
        <label>Tempo <input type="range" id="tempo" min="70" max="140" step="2"> <output id="tempoOut"></output> BPM</label>
      </div>
      <p class="msg" id="audioMsg" role="status" aria-live="polite"></p>
    </section>

    <footer>Weather and place search from the class API, combos by an AI dance captain.</footer>
  </main>

  <script>
    const API = 'https://cse2004.com/api';
    // Class key. Swap in your own before sharing the site publicly.
    const AI_KEY = '41togeg4rpup';
    const NUMS = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];

    const MOODS = {
      rainy:  { shift: -8,  line: 'Moody and grounded: slow, heavy, lots of texture.' },
      snowy:  { shift: -12, line: 'Soft and suspended: smooth, floaty, controlled.' },
      cloudy: { shift: -4,  line: 'Cool and steady: clean lines, quiet confidence.' },
      windy:  { shift: 6,   line: 'Restless and swirling: big sweeps and quick turns.' },
      sunny:  { shift: 6,   line: 'Bright and bouncy: open arms, big energy.' },
      mild:   { shift: 0,   line: 'Easy and flowing: relaxed groove, nice and even.' }
    };

    // Used if the AI service is down, so the app still works
    const FALLBACK = {
      slow: {
        name: 'Slow Drizzle',
        note: 'A house combo: heavy, grounded and smooth.',
        moves: ['Roll shoulders down', 'Step left, sink low', 'Slow arm sweep', 'Chest pop',
                'Step right, sink low', 'Wrist ripple', 'Half turn', 'Hold and breathe']
      },
      bright: {
        name: 'Sunny Side',
        note: 'A house combo: bouncy, open and bright.',
        moves: ['Big step out', 'Arms to the sky', 'Bounce twice', 'Hip swing',
                'Step back', 'Jazz hands', 'Quick spin', 'Freeze and smile']
      }
    };

    const state = { bpm: 100, weather: null, combo: null };
    const $ = (id) => document.getElementById(id);

    function setMsg(id, text, isError = false) {
      const el = $(id);
      el.textContent = text;
      el.classList.toggle('error', isError);
    }

    async function fetchJSON(url, options) {
      let res;
      try {
        res = await fetch(url, options);
      } catch {
        throw new Error('Network trouble. Check your connection and try again.');
      }
      if (!res.ok) {
        if (res.status === 429) throw new Error('Too many requests right now. Wait a minute and try again.');
        throw new Error('The service answered with an error (' + res.status + ').');
      }
      return res.json();
    }

    /* ---------- Location (Geolocation API, with manual fallback) ---------- */

    function useMyLocation() {
      if (!('geolocation' in navigator)) {
        setMsg('locMsg', 'Your browser can’t share location, so type a city instead.', true);
        $('city').focus();
        return;
      }
      setMsg('locMsg', 'Finding you…');
      navigator.geolocation.getCurrentPosition(
        (pos) => loadWeather(pos.coords.latitude, pos.coords.longitude, 'your location'),
        (err) => {
          const denied = err.code === err.PERMISSION_DENIED;
          setMsg('locMsg', denied
            ? 'Location is blocked, no problem. Type a city instead.'
            : 'Couldn’t get your location. Type a city instead.', true);
          $('city').focus();
        },
        { timeout: 10000 }
      );
    }

    async function findCity(event) {
      event.preventDefault();
      const query = $('city').value.trim();
      if (!query) {
        setMsg('locMsg', 'Type a city first.', true);
        return;
      }
      setMsg('locMsg', 'Searching…');
      try {
        const data = await fetchJSON(API + '/geocode?address=' + encodeURIComponent(query));
        const hit = data.results && data.results[0];
        if (!hit) throw new Error('I couldn’t find “' + query + '”. Try adding a state or country.');
        const { lat, lng } = hit.geometry.location;
        await loadWeather(lat, lng, hit.formatted_address);
      } catch (err) {
        setMsg('locMsg', err.message, true);
      }
    }

    /* ---------- Weather (data API) ---------- */

    function moodOf(text) {
      if (/thunder|rain|drizzle|shower/.test(text)) return 'rainy';
      if (/snow|sleet|ice|flurr|hail/.test(text)) return 'snowy';
      if (/cloud|overcast|fog|haze|mist/.test(text)) return 'cloudy';
      if (/wind|breez|gust/.test(text)) return 'windy';
      if (/clear|sun/.test(text)) return 'sunny';
      return 'mild';
    }

    function readWeather(data) {
      const cur = data.currentConditions || data;
      const temp = cur.temperature;
      if (!temp || typeof temp.degrees !== 'number') {
        throw new Error('The weather service sent something unexpected. Try another place.');
      }
      const inF = String(temp.unit || 'CELSIUS').toUpperCase().startsWith('F');
      const f = inF ? temp.degrees : temp.degrees * 9 / 5 + 32;
      const cond = cur.weatherCondition || {};
      const desc = (cond.description && cond.description.text) ||
                   String(cond.type || 'Unknown').toLowerCase().replace(/_/g, ' ');
      const speed = cur.wind && cur.wind.speed;
      const windUnit = speed && /MILE/i.test(speed.unit || '') ? 'mph' : 'km/h';
      return {
        desc,
        f,
        humidity: typeof cur.relativeHumidity === 'number' ? Math.round(cur.relativeHumidity) + '%' : '–',
        wind: speed && typeof speed.value === 'number' ? Math.round(speed.value) + ' ' + windUnit : '–',
        mood: moodOf((String(cond.type || '') + ' ' + desc).toLowerCase())
      };
    }

    function tempoFor(w) {
      const raw = 70 + (w.f - 20) * 0.7 + MOODS[w.mood].shift;
      return Math.min(140, Math.max(70, Math.round(raw / 2) * 2));
    }

    async function loadWeather(lat, lng, label) {
      setMsg('locMsg', 'Checking the sky…');
      try {
        const data = await fetchJSON(API + '/weather?latitude=' + lat + '&longitude=' + lng);
        const w = readWeather(data);
        state.weather = w;
        state.bpm = tempoFor(w);
        $('wSky').textContent = w.desc;
        $('wTemp').textContent = Math.round(w.f) + '°F';
        $('wHum').textContent = w.humidity;
        $('wWind').textContent = w.wind;
        $('moodLine').textContent = MOODS[w.mood].line;
        syncTempo();
        $('weatherCard').hidden = false;
        $('stageCard').hidden = true;
        stop();
        setMsg('locMsg', 'Showing weather for ' + label + '.');
        setMsg('comboMsg', '');
      } catch (err) {
        setMsg('locMsg', err.message, true);
      }
    }

    function syncTempo() {
      $('wBpm').textContent = state.bpm;
      $('tempo').value = state.bpm;
      $('tempoOut').textContent = state.bpm;
      document.documentElement.style.setProperty('--beat', (60 / state.bpm) + 's');
    }

    /* ---------- Combo (AI data API) ---------- */

    function extractText(data) {
      if (typeof data === 'string') return data;
      const found = data.output_text || data.text || data.response || data.output || data.content || data.message;
      return typeof found === 'string' ? found : JSON.stringify(data);
    }

    function parseCombo(text) {
      const match = text.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('The choreographer’s answer was garbled.');
      const obj = JSON.parse(match[0]);
      if (!Array.isArray(obj.moves) || obj.moves.length < 8) throw new Error('The choreographer’s answer was garbled.');
      return {
        name: String(obj.name || 'Weather Combo'),
        note: String(obj.note || ''),
        moves: obj.moves.slice(0, 8).map(String)
      };
    }

    async function makeCombo() {
      const w = state.weather;
      const btn = $('comboBtn');
      btn.disabled = true;
      stop();
      setMsg('comboMsg', 'Your dance captain is thinking…');
      const prompt = 'You are a dance captain. Weather: ' + w.desc + ', ' + Math.round(w.f) + '°F, humidity ' +
        w.humidity + ', wind ' + w.wind + '. Tempo ' + state.bpm + ' BPM. Write one 8-count combo that feels ' +
        'like this weather, doable in place by a beginner. Reply with ONLY JSON: ' +
        '{"name":"short title","note":"one sentence on the vibe","moves":["exactly 8 moves, max 5 words each, one per count"]}';
      try {
        const data = await fetchJSON(API + '/openai/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AI_KEY },
          body: JSON.stringify({ input: prompt })
        });
        state.combo = parseCombo(extractText(data));
        setMsg('comboMsg', '');
      } catch (err) {
        const slow = ['rainy', 'snowy', 'cloudy'].includes(w.mood);
        state.combo = slow ? FALLBACK.slow : FALLBACK.bright;
        setMsg('comboMsg', err.message + ' Here’s a house combo instead.', true);
      }
      showCombo();
      btn.disabled = false;
    }

    function showCombo() {
      const { name, note, moves } = state.combo;
      $('comboName').textContent = name;
      $('comboNote').textContent = note;
      const pads = $('pads');
      pads.replaceChildren();
      moves.forEach((move, i) => {
        const li = document.createElement('li');
        li.className = 'pad';
        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = i + 1;
        const m = document.createElement('span');
        m.className = 'm';
        m.textContent = move;
        li.append(n, m);
        pads.appendChild(li);
      });
      $('stageCard').hidden = false;
    }

    /* ---------- Beat and voice (Web Audio + Speech Synthesis) ---------- */

    let ctx = null;
    let noise = null;
    let timer = null;
    let frame = null;
    let nextTime = 0;
    let beat = 0;
    let queue = [];
    let playing = false;

    function makeNoise() {
      const buffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function kick(t) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      gain.gain.setValueAtTime(0.9, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    function hiss(t, type, freq, level, length) {
      const src = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      src.buffer = noise;
      filter.type = type;
      filter.frequency.value = freq;
      gain.gain.setValueAtTime(level, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + length);
      src.connect(filter).connect(gain).connect(ctx.destination);
      src.start(t);
      src.stop(t + length);
    }

    function playBeat(i, t) {
      if (i % 4 === 0) kick(t);
      if (i === 2 || i === 6) hiss(t, 'bandpass', 1500, 0.4, 0.12);
      if (i % 2 === 1) hiss(t, 'highpass', 7000, 0.15, 0.04);
    }

    function schedule() {
      while (nextTime < ctx.currentTime + 0.12) {
        playBeat(beat, nextTime);
        queue.push({ beat, time: nextTime });
        nextTime += 60 / state.bpm;
        beat = (beat + 1) % 8;
      }
    }

    function draw() {
      while (queue.length && queue[0].time <= ctx.currentTime) {
        const { beat: b } = queue.shift();
        document.querySelectorAll('.pad').forEach((pad, i) => pad.classList.toggle('on', i === b));
        speak(b);
      }
      frame = requestAnimationFrame(draw);
    }

    function speak(i) {
      if (!$('voice').checked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(NUMS[i]);
      utter.rate = 1.5;
      window.speechSynthesis.speak(utter);
    }

    function start() {
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        noise = noise || makeNoise();
      } catch {
        setMsg('audioMsg', 'Your browser blocked audio, so there’s no beat. You can still use the combo.', true);
        return;
      }
      setMsg('audioMsg', '');
      playing = true;
      beat = 0;
      queue = [];
      nextTime = ctx.currentTime + 0.1;
      timer = setInterval(schedule, 25);
      frame = requestAnimationFrame(draw);
      $('playBtn').textContent = 'Stop';
      $('controls').classList.add('playing');
    }

    function stop() {
      if (!playing) return;
      playing = false;
      clearInterval(timer);
      cancelAnimationFrame(frame);
      queue = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      document.querySelectorAll('.pad').forEach((pad) => pad.classList.remove('on'));
      $('playBtn').textContent = 'Play';
      $('controls').classList.remove('playing');
    }

    /* ---------- Wiring ---------- */

    $('geoBtn').addEventListener('click', useMyLocation);
    $('cityForm').addEventListener('submit', findCity);
    $('comboBtn').addEventListener('click', makeCombo);
    $('playBtn').addEventListener('click', () => (playing ? stop() : start()));
    $('tempo').addEventListener('input', (e) => {
      state.bpm = Number(e.target.value);
      syncTempo();
    });
  </script>
</body>
</html>
